name = "jumsup"
main = "./worker/index.js"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]
# Adding [[routes]] below makes wrangler disable the *.workers.dev URL by
# default -- keep it explicitly on, since APP_URL, the Stripe webhook
# endpoint, and Stripe's return/cancel URLs all still point at it.
workers_dev = true

[vars]
APP_URL = "https://jumsup.sakagitnat.workers.dev"
# jumsup.com is bound below as an additional custom domain for the same
# Worker -- both URLs serve the identical app. Kept out of APP_URL itself
# (used for Stripe return/cancel URLs etc.) until the custom domain has been
# confirmed working end-to-end; both are listed here so /api/* CORS checks
# (see functions/_lib/security.js) accept requests made from either origin.
ALLOWED_ORIGINS = "https://jumsup-admin.sakagitnat.workers.dev,https://jumsup.com,https://www.jumsup.com"
SUPABASE_URL = "https://vhzpmnirzgrzyaaotcep.supabase.co"
STRIPE_PRICE_PRO_MONTHLY = "price_1U7z7E016c6XVEVtLurhwTki"
STRIPE_PRICE_PRO_YEARLY = "price_1U7z7E016c6XVEVtn9BO1pE0"
STRIPE_PRICE_PRO_MONTHLY_GLOBAL = "price_1U7z7D016c6XVEVtc3rR6OUx"
STRIPE_PRICE_PRO_YEARLY_GLOBAL = "price_1U7z7D016c6XVEVtp0FflHGJ"
VAPID_SUBJECT = "mailto:sakagitnat@gmail.com"
VAPID_PUBLIC_KEY = "BJBnMngd-cs_scv7XAZbwK_VQ7oe61GUhZQa33Tnv9BnPZcqRkOeQStfN46OaM-wjaaSAF5LXxuLnoKzk5mzj2w"

[triggers]
# Sun 17:10 UTC = Mon 00:10 Asia/Bangkok  — weekly leaderboard close
# 12:00 UTC daily = 19:00 Asia/Bangkok     — push digest (streak + recap)
# 18:00 UTC daily = 01:00 Asia/Bangkok     — account-deletion sweep
crons = ["10 17 * * SUN", "0 12 * * *", "0 18 * * *"]

# Per-IP rate limiting for /api/* (workers.dev can't use the zone WAF).
[[unsafe.bindings]]
name = "API_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 150, period = 60 }

[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "jumsup.com"
custom_domain = true

[[routes]]
pattern = "www.jumsup.com"
custom_domain = true
