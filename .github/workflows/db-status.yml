name: DB Status

on:
  workflow_dispatch: {}

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Row counts and migration history (read-only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCLIENTENCODING: UTF8
        run: |
          echo '--- table row counts ---'
          psql "$SUPABASE_DB_URL" -c "
            select 'profiles' as table_name, count(*) from profiles
            union all select 'vocab_sets', count(*) from vocab_sets
            union all select 'practice_sets', count(*) from practice_sets
            union all select 'content_reviews', count(*) from content_reviews
            union all select 'content_likes', count(*) from content_likes
            union all select 'dictionary_entries', count(*) from dictionary_entries
            union all select 'dictionary_suggestions', count(*) from dictionary_suggestions
            order by 1;"
          echo '--- profiles by role, with email for any admin ---'
          psql "$SUPABASE_DB_URL" -c "select p.role, count(*) from profiles p group by 1 order by 1;"
          psql "$SUPABASE_DB_URL" -c "select u.email, p.username, p.role from profiles p join auth.users u on u.id = p.user_id where p.role='admin';"
          echo '--- dictionary_entries by target_language/status/source ---'
          psql "$SUPABASE_DB_URL" -c "select target_language, status, source, count(*) from dictionary_entries group by 1,2,3 order by 1,2,3;"
          echo '--- sample dictionary_entries (up to 10, checking Thai text integrity) ---'
          psql "$SUPABASE_DB_URL" -c "select source_word, meaning from dictionary_entries where target_language='th' order by source_word limit 10;"
          echo '--- dictionary_suggestions by status ---'
          psql "$SUPABASE_DB_URL" -c "select status, count(*) from dictionary_suggestions group by 1 order by 1;"
          echo '--- dictionary_suggestions: distinct (word, meaning, target_language) pending ---'
          psql "$SUPABASE_DB_URL" -c "select count(distinct (normalized_word, target_language, suggested_meaning)) as distinct_pairs, count(distinct normalized_word) as distinct_words from dictionary_suggestions where status='pending';"
          echo '--- dictionary_suggestions: consensus (how many users independently suggested the same pair), top 30 ---'
          psql "$SUPABASE_DB_URL" -c "select normalized_word, target_language, suggested_meaning, count(*) as contributors from dictionary_suggestions where status='pending' group by 1,2,3 order by contributors desc, normalized_word limit 30;"
          echo '--- dictionary_suggestions: raw sample, 30 arbitrary pending rows (eyeballing for junk/bad content) ---'
          psql "$SUPABASE_DB_URL" -c "select source_word, target_language, suggested_meaning, user_id from dictionary_suggestions where status='pending' order by created_at limit 15;"
          psql "$SUPABASE_DB_URL" -c "select source_word, target_language, suggested_meaning, user_id from dictionary_suggestions where status='pending' order by created_at desc limit 15;"
          echo '--- dictionary_suggestions: words already covered by an approved entry (would be redundant to approve) ---'
          psql "$SUPABASE_DB_URL" -c "select count(*) as pending_for_already_covered_word from dictionary_suggestions s where s.status='pending' and exists (select 1 from dictionary_entries e where e.normalized_word=s.normalized_word and e.target_language=s.target_language and e.status='approved');"
          echo '--- vocab_sets by source_type/visibility ---'
          psql "$SUPABASE_DB_URL" -c "select source_type, visibility, count(*) from vocab_sets group by 1,2 order by 1,2;"
          echo '--- practice_sets by kind/visibility ---'
          psql "$SUPABASE_DB_URL" -c "select kind, visibility, count(*) from practice_sets group by 1,2 order by 1,2;"
          echo '--- sample content_reviews (up to 10) ---'
          psql "$SUPABASE_DB_URL" -c "select id, content_id, rating, created_at from content_reviews order by created_at desc limit 10;"
          echo '--- _schema_migrations ---'
          psql "$SUPABASE_DB_URL" -c "select version, applied_at from _schema_migrations order by version;"
